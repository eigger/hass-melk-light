name: Tests
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.1
    with:
      standards-ref: c9b4553184f9c27bdbe7bf8564eaf10153e9575b
      domain: melk_light
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: 2026.10.2
      test-profile: ha
      pytest-args: tests/components/melk_light/ -v
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
      ha-components: bluetooth bluetooth_adapters usb
  minimum:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.1
    with:
      standards-ref: c9b4553184f9c27bdbe7bf8564eaf10153e9575b
      domain: melk_light
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      constraints: constraints/homeassistant-min.txt
      expected-ha-version: 2025.11.0
      test-profile: ha
      pytest-args: tests/components/melk_light/ -v
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
      ha-components: bluetooth bluetooth_adapters usb
