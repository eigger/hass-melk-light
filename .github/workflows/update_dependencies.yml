name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@v1.1.1
    with:
      domain: melk_light
      packages: '["blesession"]'
      python-version: '3.14'
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check
        . && python -m pytest tests/components/melk_light/ -v
      ha-components: bluetooth bluetooth_adapters usb
